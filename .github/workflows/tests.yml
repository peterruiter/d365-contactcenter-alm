name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  engine:
    name: Engine tests
    # The local runner and the exe run on Windows; test where they run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.6.0 -Force -Scope CurrentUser -SkipPublisherCheck
          ./scripts/test.ps1 -Output Normal
